name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['main']

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: parksnoopy/ubuntu-slim-zsh

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image tag
        id: tag
        run: |
          echo "DATE_TAG=$(TZ=Asia/Seoul date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build both variants locally and publish only after runtime checks.
      - name: Build root Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: root
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.DATE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build nonroot Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nonroot
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.DATE_TAG }}-nonroot
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image defaults and Python
        env:
          DATE_TAG: ${{ steps.tag.outputs.DATE_TAG }}
        run: |
          set -euo pipefail
          ROOT_IMAGE="$REGISTRY/$IMAGE_NAME:$DATE_TAG"
          NONROOT_IMAGE="$ROOT_IMAGE-nonroot"
          test "$(docker run --rm --network=none --entrypoint id "$ROOT_IMAGE" -u)" = 0
          test "$(docker run --rm --network=none --entrypoint id "$NONROOT_IMAGE" -un)" = ubuntu
          test "$(docker run --rm --network=none --entrypoint id "$NONROOT_IMAGE" -u)" = 1000
          test "$(docker run --rm --network=none --entrypoint id "$NONROOT_IMAGE" -g)" = 1000
          for IMAGE in "$ROOT_IMAGE" "$NONROOT_IMAGE"; do
            docker run --rm --network=none "$IMAGE" -ec \
              'python3 -c "import sys; assert sys.version_info[:2] == (3, 14)"; ~/bootstrap --list; touch "$HOME/.write-check"'
          done

      - name: Verify rootless bind-mount ownership
        env:
          DATE_TAG: ${{ steps.tag.outputs.DATE_TAG }}
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          WORKSPACE=$(mktemp -d "$RUNNER_TEMP/nonroot-ownership.XXXXXX")
          trap 'rm -r "$WORKSPACE"' EXIT
          docker save "$REGISTRY/$IMAGE_NAME:$DATE_TAG-nonroot" | podman load
          podman run --rm --network=none --cgroups=disabled \
            --userns=keep-id:uid=1000,gid=1000 --user=ubuntu:ubuntu \
            --volume "$WORKSPACE:/workspace:Z" --workdir /workspace \
            "$REGISTRY/$IMAGE_NAME:$DATE_TAG-nonroot" -ec \
            'test "$(id -un)" = ubuntu; touch /workspace/ownership-check'
          test "$(stat -c %u "$WORKSPACE/ownership-check")" = "$(id -u)"
          test "$(stat -c %g "$WORKSPACE/ownership-check")" = "$(id -g)"

      - name: Push verified images
        env:
          DATE_TAG: ${{ steps.tag.outputs.DATE_TAG }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$IMAGE_NAME:$DATE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:$DATE_TAG-nonroot"
